<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#111a33"/>
    </linearGradient>
    <linearGradient id="acc1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid1" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#22d3ee" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#bg1)"/>
  <rect width="800" height="500" fill="url(#grid1)"/>
  <circle cx="620" cy="120" r="220" fill="url(#glow1)"/>
  <g transform="translate(300,150)" opacity="0.95">
    <rect x="0" y="140" width="34" height="100" rx="4" fill="url(#acc1)" opacity="0.55"/>
    <rect x="50" y="100" width="34" height="140" rx="4" fill="url(#acc1)" opacity="0.75"/>
    <rect x="100" y="60" width="34" height="180" rx="4" fill="url(#acc1)"/>
    <rect x="150" y="20" width="34" height="220" rx="4" fill="#8b5cf6"/>
    <polyline points="0,120 50,80 100,50 150,10 200,-10" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
    <circle cx="200" cy="-10" r="7" fill="#ffffff"/>
  </g>
  <text x="60" y="440" font-family="Arial, sans-serif" font-size="22" fill="#9fb0d0" letter-spacing="2">FINANCE / FINTECH</text>
</svg>
