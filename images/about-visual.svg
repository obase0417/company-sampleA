<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 640">
  <defs>
    <linearGradient id="ag1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="ag2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="aglow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="720" height="640" rx="28" fill="#0b1120"/>
  <circle cx="360" cy="220" r="300" fill="url(#aglow)"/>

  <!-- back card: code editor -->
  <g transform="translate(70,120)">
    <rect width="380" height="260" rx="16" fill="#101a30" stroke="#22314f" stroke-width="1.5"/>
    <rect x="0" y="0" width="380" height="34" rx="16" fill="#141f38"/>
    <circle cx="20" cy="17" r="5" fill="#f87171"/>
    <circle cx="38" cy="17" r="5" fill="#fbbf24"/>
    <circle cx="56" cy="17" r="5" fill="#34d399"/>
    <g fill="none" stroke-linecap="round">
      <line x1="24" y1="64" x2="150" y2="64" stroke="url(#ag1)" stroke-width="6"/>
      <line x1="24" y1="88" x2="230" y2="88" stroke="#3d4a6b" stroke-width="6"/>
      <line x1="50" y1="112" x2="200" y2="112" stroke="#3d4a6b" stroke-width="6"/>
      <line x1="50" y1="136" x2="130" y2="136" stroke="url(#ag2)" stroke-width="6"/>
      <line x1="24" y1="160" x2="260" y2="160" stroke="#3d4a6b" stroke-width="6"/>
      <line x1="24" y1="184" x2="180" y2="184" stroke="#3d4a6b" stroke-width="6"/>
      <line x1="50" y1="208" x2="230" y2="208" stroke="url(#ag1)" stroke-width="6"/>
    </g>
  </g>

  <!-- front card: dashboard / network -->
  <g transform="translate(300,300)">
    <rect width="360" height="230" rx="16" fill="#101a30" stroke="#22314f" stroke-width="1.5"/>
    <g transform="translate(24,28)">
      <rect x="0" y="90" width="30" height="70" rx="4" fill="url(#ag1)" opacity="0.7"/>
      <rect x="42" y="60" width="30" height="100" rx="4" fill="url(#ag1)" opacity="0.85"/>
      <rect x="84" y="30" width="30" height="130" rx="4" fill="url(#ag2)"/>
      <rect x="126" y="70" width="30" height="90" rx="4" fill="url(#ag1)" opacity="0.6"/>
      <circle cx="240" cy="40" r="34" fill="none" stroke="url(#ag2)" stroke-width="6"/>
      <path d="M240 40 L240 12" stroke="#22d3ee" stroke-width="6" stroke-linecap="round"/>
      <line x1="190" y1="150" x2="310" y2="150" stroke="#3d4a6b" stroke-width="4"/>
      <circle cx="190" cy="150" r="5" fill="#22d3ee"/>
      <circle cx="250" cy="150" r="5" fill="#3b82f6"/>
      <circle cx="310" cy="150" r="5" fill="#8b5cf6"/>
    </g>
  </g>

  <!-- floating nodes -->
  <g fill="none" stroke="#3d4a6b" stroke-width="1.5" opacity="0.8">
    <line x1="120" y1="500" x2="220" y2="440"/>
    <line x1="220" y1="440" x2="330" y2="470"/>
  </g>
  <circle cx="120" cy="500" r="8" fill="#22d3ee"/>
  <circle cx="220" cy="440" r="6" fill="#3b82f6"/>
  <circle cx="330" cy="470" r="8" fill="#8b5cf6"/>
  <circle cx="600" cy="140" r="6" fill="#22d3ee"/>
  <circle cx="640" cy="200" r="4" fill="#3b82f6"/>
</svg>
